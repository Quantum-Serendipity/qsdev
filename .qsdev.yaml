# qsdev project configuration — generated by qsdev init.
# See: qsdev config --help
version: 2
project_name: qsdev
tier: full
languages:
    - name: go
      version: 1.26.9
overlays:
    - ./nix/go-overlay.nix
security:
    level: enhanced
tools:
    enabled:
        - agent-postmortem
        - attach-guard
        - branch-naming
        - container-security
        - context7
        - github-mcp
        - gitleaks
        - local-docs-devdocs
        - pr-labels
        - pr-templates
        - qsdev-add-dep
        - qsdev-detect
        - qsdev-disable
        - qsdev-doctor
        - qsdev-enable
        - qsdev-init
        - qsdev-onboard
        - qsdev-setup
        - qsdev-status
        - qsdev-tools
        - qsdev-update
        - secretspec
        - semble
        - semgrep
        - socket-dev-mcp
        - trail-of-bits-skills
        - version-sentinel
claude_code:
    enabled: true
    permission_level: standard
    skills:
        - security-review-owasp
    mcp_servers:
        - context7
        - github
        - socket
        - semble
        - agent-postmortem
        - version-sentinel
