# Cosign verification policy — auto-generated by qsdev
# https://docs.sigstore.dev/policy-controller/overview/
#
# Derived from the git origin remote. This policy applies only to images
# published under ghcr.io/quantum-serendipity/qsdev and admits them only when they are keyless-signed
# by a GitHub Actions workflow in github.com/Quantum-Serendipity/qsdev.
# If you publish images to another registry, change spec.images.
