rules:
  - id: qsdev.core.go.sqli-database-sql
    languages: [go]
    severity: ERROR
    message: >
      User-controlled input flows into database/sql Query() or Exec()
      without parameterization. Use placeholder parameters instead:
      db.Query("SELECT * FROM users WHERE id = $1", userID) or
      db.QueryRow("SELECT name FROM users WHERE id = ?", id).
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
    # Sinks match any arity (bind arguments may follow the query) and focus on
    # the query argument itself, so a tainted bind argument is not a finding.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($QUERY, ...)
              - pattern: $DB.QueryRow($QUERY, ...)
              - pattern: $DB.Exec($QUERY, ...)
              - pattern: $DB.Prepare($QUERY)
              - pattern: $DB.QueryContext($CTX, $QUERY, ...)
              - pattern: $DB.QueryRowContext($CTX, $QUERY, ...)
              - pattern: $DB.ExecContext($CTX, $QUERY, ...)
              - pattern: $DB.PrepareContext($CTX, $QUERY)
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseFloat(...)
    metadata:
      category: security
      subcategory: sqli
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: CWE-89
      owasp: "A03:2021"
      technology: [database-sql]

  - id: qsdev.core.go.sqli-gorm-raw
    languages: [go]
    severity: ERROR
    message: >
      User-controlled input flows into GORM Raw() without parameterization.
      Use GORM's built-in query builder or pass parameters:
      db.Raw("SELECT * FROM users WHERE id = ?", userID).Scan(&user)
      or use db.Where("id = ?", id).Find(&users).
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Raw($QUERY, ...)
              - pattern: $DB.Exec($QUERY, ...)
              - pattern: $DB.Where($QUERY, ...)
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseFloat(...)
    metadata:
      category: security
      subcategory: sqli
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: CWE-89
      owasp: "A03:2021"
      technology: [gorm]

  - id: qsdev.core.go.sqli-gin-handler
    languages: [go]
    severity: ERROR
    message: >
      User-controlled input from a Gin handler flows into a SQL query
      without parameterization. Use placeholder parameters:
      db.Query("SELECT * FROM users WHERE id = ?", c.Query("id"))
      with proper binding, or use an ORM with parameterized methods.
    mode: taint
    pattern-sources:
      # Typed so that database handles (db.Query(...)) and net/url values
      # (r.URL.Query()) are not mistaken for gin request input.
      - pattern: "($C : *gin.Context).Query(...)"
      - pattern: "($C : *gin.Context).Param(...)"
      - pattern: "($C : *gin.Context).PostForm(...)"
      - pattern: "($C : *gin.Context).DefaultQuery(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($QUERY, ...)
              - pattern: $DB.QueryRow($QUERY, ...)
              - pattern: $DB.Exec($QUERY, ...)
              - pattern: $DB.Raw($QUERY, ...)
              - pattern: $DB.QueryContext($CTX, $QUERY, ...)
              - pattern: $DB.QueryRowContext($CTX, $QUERY, ...)
              - pattern: $DB.ExecContext($CTX, $QUERY, ...)
          # gin's own c.Query("name") reads input; it is not a SQL sink.
          - pattern-not: "($GC : *gin.Context).Query(...)"
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseFloat(...)
    metadata:
      category: security
      subcategory: sqli
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe: CWE-89
      owasp: "A03:2021"
      technology: [gin, database-sql]
