apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: quantum-serendipity-qsdev-keyless
spec:
  images:
    - glob: "ghcr.io/quantum-serendipity/qsdev"
    - glob: "ghcr.io/quantum-serendipity/qsdev/**"
