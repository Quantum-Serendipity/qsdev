name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Build
        run: go build ./...

      # -race on Linux only: it roughly triples runtime, and one leg is enough
      # to catch a shared-state bug. Without it a data race surfaces as an
      # intermittent crash of the whole package binary, reported as a scatter of
      # unrelated test failures — a TestCommandTree race sat undetected on main
      # for weeks that way, and `test (ubuntu-latest)` is a required check, so
      # it randomly blocked merges.
      - name: Test
        run: gotestsum --format testname --junitfile test-results.xml -- ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} ./...

      # The integration-tagged MCP health suite builds the real qsdev binary and
      # drives it over stdio; a build failure or startup crash fails it. One leg
      # is enough to catch a binary that cannot start.
      - name: Integration tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags integration -run TestHealthCheckIntegration ./internal/mcpserve/

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # internal/archtest holds every architecture rule that still has
      # violations. Its baseline may only shrink: TestArchitecture pins it to
      # the tree, and TestBaselineMonotone rejects entries or counts that the
      # base branch does not already have, so `-update` cannot grow it.
      - name: Architecture baseline
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          baseline=internal/archtest/baseline.txt
          echo "archtest baseline entries: $(grep -cvE '^[[:space:]]*(#|$)' "$baseline")"
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git cat-file -e "origin/${BASE_REF}:${baseline}" 2>/dev/null; then
            git show "origin/${BASE_REF}:${baseline}" > "${RUNNER_TEMP}/archtest-base.txt"
            export ARCHTEST_BASE="${RUNNER_TEMP}/archtest-base.txt"
          else
            echo "::notice::origin/${BASE_REF} has no ${baseline}; this change introduces it, so there is no base to compare"
          fi
          go test -count=1 -v -run '^(TestArchitecture|TestBaselineMonotone)$' ./internal/archtest/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  pin-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Verifies every SHA in the action catalog resolves upstream and matches
      # the tag it claims, and every digest in the image catalog resolves in
      # its registry and has not fallen too far behind its tag. Offline tests
      # cannot catch a well-formed but wrong pin, and such a pin fails only
      # when a generated workflow runs — in somebody else's repository.
      - name: Verify action and image pins against upstream
        run: go test ./internal/cigeneration/ -run 'Test(Action|Image)PinsResolveUpstream$' -v
        env:
          VERIFY_ACTION_PINS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs the OpenGrep rule library through the engine: every shipped rule must
  # parse (an unparsable rule is dropped with only a warning) and the
  # annotated fixtures under rules/core/testdata must match, with zero
  # findings on the safe fixtures. The unit-test job skips these checks
  # because it has no scanner installed.
  rules:
    runs-on: ubuntu-latest
    env:
      OPENGREP_VERSION: "1.21.0"
      # Release asset digest of opengrep_manylinux_x86 for OPENGREP_VERSION
      # (also pinned in nix/opengrep/default.nix).
      OPENGREP_SHA256: 9ed0ceee4a3a406d27d40894bcce85ea151be21e6d4b180689689224faff2a3e
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install OpenGrep (pinned, checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/opengrep"
          curl -fsSL -o "$RUNNER_TEMP/opengrep/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $RUNNER_TEMP/opengrep/opengrep" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/opengrep/opengrep"
          echo "$RUNNER_TEMP/opengrep" >> "$GITHUB_PATH"

      - name: Validate rules and fixtures
        run: go test -count=1 -run 'TestCoreRules_' -v ./rules/
        env:
          QSDEV_REQUIRE_RULE_SCANNER: "1"

  # Builds the MCP gateway image from build/docker/Dockerfile and runs the
  # container suite against it (size, version stamping, startup, auth). A stale
  # base-image pin (e.g. a Go older than go.mod requires) fails here.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and test the gateway image
        run: go test -tags integration -count=1 -v ./internal/mcpserve/container/

  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash scripts/install.sh --dry-run
          - os: windows-latest
            script: pwsh scripts/install.ps1 -DryRun
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate install script (dry-run)
        run: ${{ matrix.script }}
        env:
          QSDEV_INSTALL_VERSION: ${{ steps.version.outputs.value }}

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact pin: this binary runs with the release signing identity
          # and tap tokens. Keep ci.yml and release.yml on the same version;
          # Renovate's custom manager (renovate.json) bumps both.
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.2
          args: check

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact pin: this binary runs with the release signing identity
          # and tap tokens. Keep ci.yml and release.yml on the same version;
          # Renovate's custom manager (renovate.json) bumps both.
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,sign

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ github.sha }}
          path: dist/*
          retention-days: 7
