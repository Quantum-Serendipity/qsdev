# Security scanning workflow
# Generated by qsdev — do not edit manually.
name: Security Scan

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate lock files
        run: |
          echo "Checking lock file integrity..."
          # Verify lock files exist and are committed
          for f in package-lock.json pnpm-lock.yaml yarn.lock Cargo.lock go.sum poetry.lock uv.lock; do
            if [ -f "$f" ]; then
              echo "  ✓ $f present"
              git diff --exit-code "$f" || echo "  WARNING: $f has uncommitted changes"
            fi
          done

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            .
