# Security claims (TR-1): each user-facing security sentence is bound to the
# Go tests that prove it. docs/claims_test.go checks this file:
#   - every claim's text occurs in each listed file (whitespace-collapsed);
#   - every listed test exists and never calls t.Skip, t.Skipf or t.SkipNow,
#     directly or through a same-package helper it calls; a bare name must be
#     unique in the module, otherwise qualify it as <package dir>.TestName;
#   - no retracted phrase or pattern appears in any scanned file or in this
#     file (any case, across line wraps, markdown emphasis, code markers and
#     link targets ignored, fenced code included);
#   - warn mode: prose lines with a keyword that no claim covers, and claims
#     with no test yet, are logged (enforced from W3).
version: 1

scan:
  - README.md
  - SECURITY.md
  - CLAUDE.md
  - docs/*.md
  - internal/profile/templates/security-overview.md.tmpl

keywords:
  - blocks
  - prevents
  - cannot
  - fail-closed
  - sandboxed
  - enforced
  - out of the box
  - verified
  - protected
  - fail closed
  - can't

claims:
  - id: default-layers
    text: >-
      each generated by default where it applies: container security when a
      container build is detected, and license compliance is not yet on by
      default.
    files: [README.md]
    tests: []
    tiers: [supply-chain-only, standard, full]

  - id: policy-engine-not-enabled
    text: >-
      The policy engine (`qsdev enforce`) exists but no tier or preset enables
      it yet; it is planned for the full tier.
    files:
      - README.md
      - docs/security-architecture.md
      - docs/team-onboarding.md
      - docs/migration-guide.md
      - docs/configuration-reference.md
      - internal/profile/templates/security-overview.md.tmpl
    tests: []
    tiers: [supply-chain-only, standard, full]

  - id: mcp-confused-deputy-not-enabled
    text: >-
      the confused-deputy path check that would cover them runs inside the
      `qsdev enforce` hook, which no tier or preset enables yet.
    files: [docs/configuration-reference.md]
    tests: []
    tiers: [supply-chain-only, standard, full]

  - id: risk-scoring-unavailable
    text: Package risk scoring is not yet available
    files:
      - README.md
      - docs/security-architecture.md
      - docs/migration-guide.md
      - internal/profile/templates/security-overview.md.tmpl
    tests: []
    tiers: [supply-chain-only, standard, full]

  - id: deny-rules-pipe-to-shell
    text: >-
      so known spellings of `curl | sh` and unvetted package installs are
      denied or routed through the package guard
    files: [README.md]
    tests: [TestGenerateSettings_CriticalDenyRulesPresent]
    tiers: [supply-chain-only, standard, full]

  - id: selfprotect-tripwire
    text: >-
      Agent self-protection blocks the direct ways an agent edits qsdev's
      guardrails. It is a best-effort syntactic tripwire, not a sandbox.
    files:
      - README.md
      - docs/security-architecture.md
      - internal/profile/templates/security-overview.md.tmpl
    tests:
      - TestBash_ShellSpellingBypasses
      - TestBash_ArbitraryMutatorBypasses
      - TestSP011_HookCommandHijack
      - TestCheck_Obfuscation
    tiers: [standard, full]

  - id: structural-generated-file-integrity
    text: >-
      Structural protection: `qsdev check` reports edited or deleted
      machine-owned generated files against the committed
      `.qsdev-generated.sha256`, and the generated `.claude/settings.json`
      carries permission deny rules
    files: [README.md, docs/security-architecture.md]
    tests:
      - TestCheckCmd_CICheckoutDetectsGeneratedFileDrift
      - TestCheckGeneratedFiles_ManifestMissingOrBroken
      - TestGenerateSettings_CriticalDenyRulesPresent
    tiers: [supply-chain-only, standard, full]

  - id: hook-sandbox-experimental
    text: >-
      not yet enableable from the CLI (planned opt-in `--claude-hooks
      sandbox`, Linux/Nix builds)
    files: [README.md, docs/security-architecture.md, docs/team-onboarding.md]
    tests: []
    tiers: []

  - id: default-layers-architecture
    text: >-
      Layers 1–11 are each generated by default where they apply: container
      security when a container build is detected, and license compliance is
      not yet on by default.
    files: [docs/security-architecture.md]
    tests: []
    tiers: [supply-chain-only, standard, full]

  - id: agent-os-sandbox-off
    text: >-
      Claude Code's OS-level sandbox is not enabled at any tier (the generated
      `.claude/settings.json` sets no `sandbox`)
    files: [docs/security-architecture.md]
    tests: [TestGenerateSettings_NoSandbox]
    tiers: [supply-chain-only, standard, full]

  - id: enforce-always-not-liftable
    text: cannot be lifted with `qsdev session allow`
    files: [docs/security-architecture.md, docs/team-onboarding.md, docs/migration-guide.md]
    tests: [TestEvaluate_EnforceAlwaysBlocks]
    tiers: []

  - id: selfprotect-deadline
    text: >-
      fail-closed: an evaluation error, a missing binary or interpreter, and
      an evaluation that overruns its deadline all block the call, since the
      generated wrapper turns a hook that cannot start into a block and the
      hook denies before its registered timeout
    files: [docs/roadmap.md, internal/profile/templates/security-overview.md.tmpl]
    tests: [TestBuildHooks_SecurityHooksFailClosed, TestRunSelfprotect_DeadlineDenies, TestSelfprotectHookTimeoutCoversDeadline, TestHookRegistry_FailClosedTimeouts]
    tiers: [standard, full]

  - id: age-gate-per-level
    text: >-
      The generated package-manager settings gate installs for at least the
      level's window where the package manager supports an age gate.
    files: [docs/team-onboarding.md]
    tests: [TestSecurityConfigs_MinReleaseAgeByComplianceLevel, TestUVExcludeNewerByComplianceLevel, TestBuildHookEnv_PackageGuardMinAgeDays, TestPackageGuardMinAgeDays_NeverBelowFloor, TestGenerate_StrictTierAgeGates, TestCheckSecurityHardening_AgeGateBelowComplianceLevel, TestRenovate_MinimumReleaseAgeByComplianceLevel]
    tiers: [supply-chain-only, standard, full]

  - id: harden-runner-audit
    text: harden-runner monitors egress (audit mode)
    files: [docs/security-architecture.md]
    tests: []
    tiers: [standard, full]

  - id: harden-runner-audit-overview
    text: >-
      StepSecurity Harden-Runner provides egress monitoring for GitHub Actions
      workflows (qsdev configures audit mode).
    files: [docs/security-overview.md, internal/profile/templates/security-overview.md.tmpl]
    tests: []
    tiers: [standard, full]

  - id: installer-signature
    text: >-
      The installer checks downloads against SHA-256 checksums and, when a
      cosign that supports `--bundle` (v2 or later) is installed, verifies the
      Sigstore signature; otherwise only
      SHA-256 against checksums from the same release (no authenticity check),
      and with no checksum tool (`sha256sum` or `shasum`) it installs
      unverified; pass `--require-signature` to refuse instead.
    files: [README.md]
    # TestInstall_Sigstore and TestInstall_RequireSignatureWithoutChecksumTool
    # cover this on Linux and macOS, but skip elsewhere through newEnv, so
    # they cannot be bound until claims can carry a platform scope.
    tests: []
    tiers: []

  - id: release-provenance
    text: >-
      Releases carry [SLSA](https://slsa.dev/) Build L2 provenance (GitHub
      artifact attestations)
    files: [SECURITY.md]
    tests: [TestReleaseAttestsEveryPublishedArtifact]
    tiers: []

  - id: gateway-image-signed
    text: >-
      The gateway container image (`ghcr.io/quantum-serendipity/qsdev`) is
      published for linux/amd64 and linux/arm64, cosign keyless-signed by the
      `release.yml` workflow and carries build provenance; the release
      verifies the signature against that workflow's exact identity before
      publishing binaries
    files: [SECURITY.md]
    tests:
      - TestGatewayImagePublishedSignedAttested
      - TestGatewayImageIdentityMatchesReleaseWorkflow
      - TestDockerfileCrossCompiles
    tiers: []

  - id: version-sentinel-advisory
    text: >-
      MCP tools give advisory (non-blocking) dependency version checks for:
      go.mod. Use them when changing dependencies.
    files: [CLAUDE.md]
    tests: [TestVersionSentinelClaudeMdSection, TestManifestCoverage_AgreesWithClaudeMdSection]
    tiers: [standard, full]

  - id: mcp-gated-tools-operator-opt-in
    text: >-
      The server does not mount `qsdev_nix_run` or `qsdev_credential_vend`
      without an operator opt-in that the project's qsdev configuration cannot
      set
    files: [docs/configuration-reference.md, docs/security-architecture.md]
    tests:
      - TestMountOptions_NixRunOffByDefault
      - TestMountOptions_CredentialVendNeedsOperatorConfirm
      - TestMountOptions_StandaloneNeedsDeploymentFlag
      - TestLoadProjectConfig_CommittedOptInKeysFailClosed
      - TestProjectOverlayRejectsMCPServe
      - TestLoadUserScope_BrokenOrgOverlayFailsClosed
    tiers: []

  - id: mcp-gateway-vend-needs-agents
    text: >-
      credential vending without an agent allow-list (`QSDEV_GATEWAY_AGENTS`)
      is refused at startup.
    files: [docs/configuration-reference.md, docs/security-architecture.md]
    tests: [TestMountOptions_GatewayCredentialVendNeedsFlagAndAgents]
    tiers: []

  - id: mcp-nix-run-bash-deny
    text: >-
      A `qsdev_nix_run` call is refused when its Bash equivalent matches a
      Bash deny rule
    files: [docs/configuration-reference.md]
    tests:
      - TestNixRun_BashEquivalentDenied
      - TestBashEquivalents
      - TestFirstMatchingBashRule
      - TestNixRunDenyRules
      - TestServeBuildsNixRunDenyRulesOnlyWhenMounted
    tiers: []

  - id: mcp-http-bearer-token
    text: >-
      answers `401` to every request that does not send it as
      `Authorization: Bearer <token>`, comparing in constant time
    files: [docs/security-architecture.md]
    tests:
      - TestHTTPLoopback_RequiresToken
      - TestHTTPToken_RemovedOnShutdown
      - TestBearerAuth_HealthExemptStandalone
      - TestResolveHTTPToken
    tiers: []

  - id: mcp-http-token-file
    text: >-
      A request without it, or with another token, gets `401` before any tool
      runs.
    files: [docs/configuration-reference.md]
    tests:
      - TestHTTPLoopback_RequiresToken
      - TestHTTPToken_DefaultPathUnderUserState
      - TestHTTPHandlerMTLSPathNoBearer
    tiers: []

  - id: mcp-http-no-auth-drops-gated-tools
    text: >-
      `--http-no-auth` drops the token, and the server then mounts neither
      `qsdev_nix_run` nor `qsdev_credential_vend`
    files: [docs/security-architecture.md]
    tests: [TestMountOptions_HTTPNoAuthRefusesGatedTools]
    tiers: []

# Overclaims withdrawn by H0-1. The claims test fails if any comes back.
# No entry may match this file's own text, so the retracted wording appears
# verbatim nowhere in the repository: write a pattern, where a bracketed
# "[ ]" stands for a space, or a double-quoted phrase with "\x20" for one.
retracted:
  - pattern: '\b(14|fourteen)\b[^.]{0,20}\blayers?\b'
    reason: the policy engine is not enabled by any tier and risk scoring has no caller
    finding: U27-01
  - pattern: 'the policy engine[ ]evaluates tool calls'
    reason: no tier or preset registers `qsdev enforce` as a hook
    finding: U27-01
  - pattern: '\bconfigured out[- ]of[- ]the[- ]box\b'
    reason: only controls the tier-default generation produces may be called default (TR-2)
    finding: U27-01
  - pattern: '18 self-protection rules so your ai agent[ ]can.?t'
    reason: self-protection is a syntactic tripwire with known bypasses (TR-4)
    finding: U18-14
  - pattern: '\b(hooks?|run|runs|executed)\b.{0,20}\b(in|inside)[ ](a|the) sandbox\b'
    reason: hook sandboxing cannot be enabled from the CLI
    finding: U05-01
  - pattern: '\bhooks (are|run)[ ]sandboxed\b'
    reason: hook sandboxing cannot be enabled from the CLI
    finding: U05-01
  - pattern: 'sigstore cosign[ ]\(when cosign is available\)'
    reason: without cosign the installer checks only SHA-256 from the same release
    finding: U25-01
  - pattern: '\bslsa (build )?(level|l) ?3\b'
    reason: provenance is attested in the job that builds and signs, which is Build L2
    finding: U26-06
  - pattern: 'guards[ ]dependency changes'
    reason: Version-Sentinel is advisory; it checks versions and blocks nothing (TR-6)
    finding: U22-03
  - pattern: '\b(168|336) ?h(ours?|rs?)?\b'
    reason: the compliance level does not select the age gate; every level generates at least 72 hours (3 days)
    finding: U27-03
  - pattern: "\\bcan(not|'t| not)[ ]be (bypassed|circumvented)\\b"
    reason: self-protection and deny rules are syntactic; enforce_always only means `qsdev session allow` cannot lift a rule (TR-4)
    finding: U18-14
  - pattern: '\b(with|uses?) fail[- ]closed semantics'
    reason: fail-closed holds only through the generated wrapper and the hooks' own deadlines, so the bare phrase overclaims for hand-written hooks (TR-3)
    finding: U18-14
  - pattern: 'multiple denials[ ]are collected'
    reason: the self-protection hook reports only the first denial
    finding: U18-14
  - pattern: '\.qsdev/policy[/]'
    reason: the policy engine reads .qsdev/policy.yaml, and no tier generates it
    finding: U27-01
  - pattern: 'prevents[ ]bypassing'
    reason: Claude Code's OS sandbox is off at every tier; permission rules match spellings only
    finding: XS-N2
  - pattern: 'constrains[ ]network egress'
    reason: every harden-runner step runs with egress-policy audit, which monitors and blocks nothing
    finding: U26-V01
  - pattern: 'policy enforcement[ ]for github'
    reason: every harden-runner step runs with egress-policy audit, which monitors and blocks nothing
    finding: U26-V01
  - pattern: 'path-checked by the confused[- ]deputy'
    reason: the confused-deputy path check runs only inside `qsdev enforce`, which no tier or preset registers
    finding: U27-01
  - pattern: 'times out or cannot start[ ]lets it through'
    reason: the generated fail-closed wrapper blocks a hook that cannot start, and the hooks deny before their registered timeout
    finding: XS-WS1
