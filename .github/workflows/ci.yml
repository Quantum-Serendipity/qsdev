name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Load tool versions
        # Single source of the tool versions below; see the file's header.
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@${{ env.GOTESTSUM_VERSION }}

      - name: Build
        run: go build ./...

      # -race on Linux only: it roughly triples runtime, and one leg is enough
      # to catch a shared-state bug. Without it a data race surfaces as an
      # intermittent crash of the whole package binary, reported as a scatter of
      # unrelated test failures — a TestCommandTree race sat undetected on main
      # for weeks that way, and `test (ubuntu-latest)` is a required check, so
      # it randomly blocked merges.
      - name: Test
        run: gotestsum --format testname --junitfile test-results.xml -- -shuffle=on ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} ./...

      # The integration-tagged MCP health suite builds the real qsdev binary and
      # drives it over stdio; a build failure or startup crash fails it. One leg
      # is enough to catch a binary that cannot start.
      - name: Integration tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags integration -run TestHealthCheckIntegration ./internal/mcpserve/

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          retention-days: 30

  # Runs the whole suite with project markers (.qsdev.yaml, .qsdev/, .devinit/,
  # .claude/, CLAUDE.md, devenv.nix) planted in /tmp and in a trusted 0755
  # TMPDIR, in a shuffled order. A test that treats t.TempDir() as a project
  # without its own .git ceiling (use testutil.IsolatedDir/Project) walks into
  # the planted ancestor and fails here instead of on a developer machine.
  # Reproduce locally with PLANT_ROOT=<scratch dir> scripts/ci/planted-markers.sh.
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hermetic-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Test with planted project markers
        run: scripts/ci/planted-markers.sh

      # XS-N5 (XS-WS6 F3): planted project markers in a shared directory
      # never reach a project below it, run against the built binary.
      - name: Root-hijack E3
        run: |
          go build -o "${RUNNER_TEMP}/qsdev" ./cmd/qsdev
          scripts/e2e/root-hijack.sh "${RUNNER_TEMP}/qsdev" | tee "${RUNNER_TEMP}/root-hijack.log"
          grep -qx 'root-hijack: ok' "${RUNNER_TEMP}/root-hijack.log"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # internal/archtest holds every architecture rule that still has
      # violations. Its baseline may only shrink: TestArchitecture pins it to
      # the tree, and TestBaselineMonotone rejects entries or counts that the
      # base branch does not already have, so `-update` cannot grow it.
      - name: Architecture baseline
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          baseline=internal/archtest/baseline.txt
          echo "archtest baseline entries: $(grep -cvE '^[[:space:]]*(#|$)' "$baseline")"
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git cat-file -e "origin/${BASE_REF}:${baseline}" 2>/dev/null; then
            git show "origin/${BASE_REF}:${baseline}" > "${RUNNER_TEMP}/archtest-base.txt"
            export ARCHTEST_BASE="${RUNNER_TEMP}/archtest-base.txt"
          else
            echo "::notice::origin/${BASE_REF} has no ${baseline}; this change introduces it, so there is no base to compare"
          fi
          go test -count=1 -v -run '^(TestArchitecture|TestBaselineMonotone)$' ./internal/archtest/

      - name: Load tool versions
        # Single source of the tool versions below; see the file's header.
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env >> "$GITHUB_ENV"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Load tool versions
        # Single source of the tool versions below; see the file's header.
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...

  pin-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Verifies every SHA in the action catalog resolves upstream and matches
      # the tag it claims, and every digest in the image catalog resolves in
      # its registry and has not fallen too far behind its tag. Offline tests
      # cannot catch a well-formed but wrong pin, and such a pin fails only
      # when a generated workflow runs — in somebody else's repository.
      - name: Verify action and image pins against upstream
        run: go test ./internal/cigeneration/ -run 'Test(Action|Image)PinsResolveUpstream$' -v
        env:
          VERIFY_ACTION_PINS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verifies every npx/uvx package the tool catalog launches as an MCP
      # server exists on npm or PyPI at its pinned version: a typo or a
      # yanked release would otherwise ship as a server that cannot start.
      - name: Verify MCP server packages against their registries
        run: go test ./internal/catalog/ -run '^TestMCPServerPackagesResolve$' -v
        env:
          VERIFY_MCP_PACKAGES: "1"

  # Runs the whole suite where the tools its output checks need are present,
  # so they fail instead of skipping: Nix (evaluation of rendered devenv.nix,
  # nixpkgs attributes), bubblewrap and the Landlock helper (the E3 sandbox
  # tests), and the secret scanners. Every switch below turns "tool
  # unavailable" into a failure (internal/testutil/require.go), and skipreport
  # fails the job on any skip that names one of their tools, which catches a
  # raw t.Skip that bypasses testutil.RequireTool. The tools come from the
  # flake's pinned nixpkgs, and both NIX_PATH and the nixpkgs flake registry
  # entry are pinned to flake.lock, so no upstream nixpkgs change can turn
  # this check red without a repo change. CGO_ENABLED=0 matches flake.nix's
  # qsdev build: a cgo test binary links the host's /lib64 loader, which the
  # bwrap sandbox does not mount. coreutils and bash come from nixpkgs so the
  # E3 hooks' cat and sh resolve into /nix/store. The ldflags inject the ll-restrict and seccomp
  # store paths exactly as flake.nix does; without them sandbox.LLRestrictBin
  # is empty and the Landlock E3 test cannot run. No -race: the ubuntu test
  # leg covers that.
  nix-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      QSDEV_REQUIRE_NIX: "1"
      QSDEV_REQUIRE_E3: "1"
      QSDEV_CHECK_NIX_ATTRS: "1"
      QSDEV_REQUIRE_SECTOOLS: "1"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Load tool versions
        # Single source of the tool versions below; see the file's header.
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@${{ env.GOTESTSUM_VERSION }}

      # The official release tarball, checked against its pinned SHA-256 in
      # .github/tool-versions.env before it runs; no third-party action.
      - name: Install Nix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor,
      # and bwrap needs one.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build qsdev and the sandbox helpers
        id: nix-build
        run: |
          nix build --no-link --print-out-paths .#qsdev .#ll-restrict .#seccomp-filter
          echo "ll-restrict=$(nix build --no-link --print-out-paths .#ll-restrict)" >> "$GITHUB_OUTPUT"
          echo "seccomp-filter=$(nix build --no-link --print-out-paths .#seccomp-filter)" >> "$GITHUB_OUTPUT"

      - name: Check the flake
        run: nix flake check

      # offlineNixEnv resolves <nixpkgs> through NIX_PATH; point it at the
      # flake's locked nixpkgs so evaluation never reaches a channel.
      - name: Pin NIX_PATH to the locked nixpkgs
        run: echo "NIX_PATH=nixpkgs=$(nix eval --raw --inputs-from . nixpkgs#path)" >> "$GITHUB_ENV"

      # The nixpkgs attribute checks evaluate `nixpkgs#...`, which resolves
      # through the flake registry (rolling nixpkgs-unstable by default), not
      # NIX_PATH. Pin the registry entry to the same locked revision.
      - name: Pin the nixpkgs flake registry to the locked nixpkgs
        shell: bash
        run: |
          node=$(jq -r '.nodes.root.inputs.nixpkgs' flake.lock)
          rev=$(jq -r --arg n "$node" '.nodes[$n].locked.rev' flake.lock)
          nix registry add nixpkgs "github:NixOS/nixpkgs/${rev}"

      - name: Test with the tools required
        env:
          LL_RESTRICT: ${{ steps.nix-build.outputs.ll-restrict }}
          SECCOMP_FILTER: ${{ steps.nix-build.outputs.seccomp-filter }}
        run: |
          nix shell --inputs-from . nixpkgs#bubblewrap nixpkgs#coreutils nixpkgs#bash nixpkgs#gitleaks nixpkgs#ripsecrets --command \
            gotestsum --format testname --jsonfile test.json -- -count=1 \
            -ldflags "-X github.com/Quantum-Serendipity/qsdev/internal/sandbox.llRestrictPath=${LL_RESTRICT}/bin/ll-restrict -X github.com/Quantum-Serendipity/qsdev/internal/sandbox.seccompFilterPath=${SECCOMP_FILTER}/hook-blocklist.bpf" \
            ./...

      - name: Reject skips of required tools
        if: ${{ !cancelled() }}
        run: go run ./internal/testutil/cmd/skipreport test.json

  # Builds the OpenGrep derivation (nix/opengrep) on every platform it
  # advertises, smoke-tests the binary, and runs the rule library through it:
  # every shipped rule must parse (an unparsable rule is dropped with only a
  # warning) and the annotated fixtures under rules/core/testdata must match,
  # with zero findings on the safe fixtures. The unit-test job skips these
  # checks because it has no scanner installed. qsdev embeds this derivation
  # into user projects, so a broken unpack, patchelf or hash fails here first.
  # One leg also verifies the pinned release hash of every platform.
  opengrep-nix:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # The official release tarball, checked against its pinned SHA-256 in
      # .github/tool-versions.env before it runs; no third-party action.
      - name: Install Nix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      - name: Build OpenGrep and validate rules and fixtures
        run: nix/opengrep/test-packaging.sh

      # Runs even when the build above failed, so a version bump reports every
      # platform's hash result at once instead of hiding three behind one.
      - name: Verify every platform's release hash
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: nix/opengrep/test-packaging.sh --hashes-only

  # Builds the MCP gateway image from build/docker/Dockerfile and runs the
  # container suite against it (size, version stamping, startup, auth). A stale
  # base-image pin (e.g. a Go older than go.mod requires) fails here.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build and test the gateway image
        run: go test -tags integration -count=1 -v ./internal/mcpserve/container/

  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash scripts/install.sh --dry-run
          - os: windows-latest
            script: pwsh scripts/install.ps1 -DryRun
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate install script (dry-run)
        run: ${{ matrix.script }}
        env:
          QSDEV_INSTALL_VERSION: ${{ steps.version.outputs.value }}

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Load tool versions
        # Single source of the tool versions below; see the file's header.
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          # Exact pin from .github/tool-versions.env, bumped by
          # .github/workflows/tool-pins.yml: this binary runs with the release
          # signing identity and tap tokens, and CI validates the same
          # version the release runs (TestGoreleaserVersionPinned).
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          # Exact pin from .github/tool-versions.env, bumped by
          # .github/workflows/tool-pins.yml: this binary runs with the release
          # signing identity and tap tokens, and CI validates the same
          # version the release runs (TestGoreleaserVersionPinned).
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish,sign

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ github.sha }}
          path: dist/*
          retention-days: 7
