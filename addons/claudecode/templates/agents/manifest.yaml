# Agent manifest. Each entry names a template in this directory
# (<name>.md) and is deployed to .claude/agents/<name>.md.
#
# Schema:
#   name:        agent name; must match the template file name.
#   description: one-line summary shown in listings.
#   tags:        free-form labels for filtering.
#   read_only:   true when the agent cannot edit files. The template's
#                `tools:` allowlist must name none of Write, Edit, MultiEdit
#                or NotebookEdit, and its `disallowedTools:` must block Write
#                and Edit (both pinned by tests). read_only does NOT mean Bash
#                cannot write: Claude Code honors a parenthesised specifier in
#                an agent's `tools:` only for Agent(...), so Bash cannot be
#                scoped to commands there. Bash stays and is governed by the
#                project's permission rules and hooks.
agents:
  - name: security-reviewer
    description: "Security-focused code review with OWASP methodology"
    tags: [security, review]
    read_only: true
  - name: codebase-explorer
    description: "Rapid codebase architecture exploration"
    tags: [exploration, onboarding]
    read_only: true
  - name: test-gap-analyzer
    description: "Identify untested code paths and coverage gaps"
    tags: [testing, coverage]
    read_only: true
  - name: onboarding-guide
    description: "Interactive codebase mentoring for new engineers"
    tags: [onboarding, documentation]
    read_only: true
  - name: migration-planner
    description: "Framework upgrade risk assessment and migration planning"
    tags: [migration, planning]
    read_only: true
  - name: handoff-doc-generator
    description: "Client handoff documentation synthesis"
    tags: [documentation, handoff]
    read_only: false
  - name: incident-debugger
    description: "Systematic incident debugging with hypothesis testing"
    tags: [debugging, incident]
    read_only: true
